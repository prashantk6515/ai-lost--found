# MySQL / MariaDB Production Profile Configuration
# Activate this profile using: --spring.profiles.active=mysql
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/lost_found_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=CollegeLostAndFoundManagementSystemSuperSecureKey2026WithHighEntropySecret!
app.jwt.expiration-ms=86400000
