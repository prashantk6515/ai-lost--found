# Server Configuration
server.port=8085

# Application Name
spring.application.name=college-lost-found

# Default Profile Database: Persistent File-based H2 Database
spring.datasource.url=jdbc:h2:file:./data/lostfounddb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# File Upload Configuration (Up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=CollegeLostAndFoundManagementSystemSuperSecureKey2026WithHighEntropySecret!
app.jwt.expiration-ms=86400000
